# ================= APPLICATION =================
spring.application.name=api-gateway
server.port=8080

# ================= CONFIG SERVER =================
# spring.config.import=optional:configserver:http://localhost:8888
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false
spring.cloud.config.allow-override=true
spring.cloud.config.override-none=true

# ================= EUREKA =================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true


# ================= ACTUATOR =================
management.endpoints.web.exposure.include=*
management.endpoint.gateway.enabled=true
management.endpoint.health.show-details=always

# ================= USER SERVICE =================
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[0].filters[0].args.name=userServiceCB
spring.cloud.gateway.routes[0].filters[0].args.fallbackUri=forward:/fallback/user

# ================= VAULT SERVICE =================
spring.cloud.gateway.routes[1].id=vault-service
spring.cloud.gateway.routes[1].uri=lb://VAULT-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/vault/**
spring.cloud.gateway.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[1].filters[0].args.name=vaultServiceCB
spring.cloud.gateway.routes[1].filters[0].args.fallbackUri=forward:/fallback/vault
spring.cloud.gateway.routes[1].filters[1].name=RequestRateLimiter
spring.cloud.gateway.routes[1].filters[1].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.routes[1].filters[1].args.redis-rate-limiter.burstCapacity=20
spring.cloud.gateway.routes[1].filters[1].args.key-resolver=#{@userKeyResolver}

# ================= GENERATOR SERVICE =================
spring.cloud.gateway.routes[2].id=generator-service
spring.cloud.gateway.routes[2].uri=lb://GENERATOR-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/generator/**
spring.cloud.gateway.routes[2].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[2].filters[0].args.name=generatorServiceCB
spring.cloud.gateway.routes[2].filters[0].args.fallbackUri=forward:/fallback/generator

# ================= SECURITY SERVICE =================
spring.cloud.gateway.routes[3].id=security-service
spring.cloud.gateway.routes[3].uri=lb://SECURITY-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/security/**
spring.cloud.gateway.routes[3].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[3].filters[0].args.name=securityServiceCB
spring.cloud.gateway.routes[3].filters[0].args.fallbackUri=forward:/fallback/security

# ================= NOTIFICATION SERVICE =================
spring.cloud.gateway.routes[4].id=notification-service
spring.cloud.gateway.routes[4].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/notifications/**
spring.cloud.gateway.routes[4].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[4].filters[0].args.name=notificationServiceCB
spring.cloud.gateway.routes[4].filters[0].args.fallbackUri=forward:/fallback/notification

# ================= LOGGING =================
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.io.github.resilience4j=DEBUG
logging.level.org.springframework.security=DEBUG

# ================= REDIS =================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ================= CORS =================
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true

# ================= CIRCUIT BREAKER =================
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowSize=5
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=2
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10s
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.eventConsumerBufferSize=10

# Instance specific settings for userServiceCB
resilience4j.circuitbreaker.instances.userServiceCB.baseConfig=default

# ================= TIME LIMITER =================
resilience4j.timelimiter.configs.default.timeoutDuration=15s
resilience4j.timelimiter.instances.userServiceCB.timeoutDuration=15s

# ================= TIMEOUT =================
spring.cloud.gateway.httpclient.connect-timeout=5000
spring.cloud.gateway.httpclient.response-timeout=15s