server.port=8888
spring.application.name=config-server

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Switch to 'native' profile for local development to use files in /configs
# Use 'git' for production/cloud environments
spring.profiles.active=native

# Path to the local configuration files
spring.cloud.config.server.native.search-locations=classpath:/configs

# Git configuration (kept for reference or manual switch)
spring.cloud.config.server.git.uri=https://github.com/bharathaadhi/config_revpassword
spring.cloud.config.server.git.clone-on-start=true