<h2 mat-dialog-title>Add New Password</h2>

<div mat-dialog-content class="form">

  <!-- Account -->
  <mat-form-field appearance="outline">
    <mat-label>Account</mat-label>
    <input matInput [(ngModel)]="form.account">
  </mat-form-field>

  <!-- Username -->
  <mat-form-field appearance="outline">
    <mat-label>Username</mat-label>
    <input matInput [(ngModel)]="form.username">
  </mat-form-field>

  <!-- Password -->
  <mat-form-field appearance="outline">
    <mat-label>Password</mat-label>
    <input matInput type="password"
           [(ngModel)]="form.password">
  </mat-form-field>

  <!-- ✅ CATEGORY FIXED -->
  <mat-form-field appearance="outline">
    <mat-label>Category</mat-label>

    <mat-select [(ngModel)]="form.category">

      <mat-option value="SOCIAL_MEDIA">
        Social Media
      </mat-option>

      <mat-option value="BANKING">
        Banking
      </mat-option>

      <mat-option value="WORK">
        Work
      </mat-option>

      <mat-option value="SHOPPING">
        Shopping
      </mat-option>

      <mat-option value="OTHER">
        Other
      </mat-option>

    </mat-select>

  </mat-form-field>

  <!-- ✅ NOTES FIXED -->
  <mat-form-field appearance="outline">
    <mat-label>Notes</mat-label>

    <textarea
      matInput
      rows="3"
      [(ngModel)]="form.notes">
    </textarea>

  </mat-form-field>

</div>

<div mat-dialog-actions align="end">

  <button mat-button mat-dialog-close>
    Cancel
  </button>

  <button mat-raised-button
          color="primary"
          (click)="save()">
    Save
  </button>

</div>
