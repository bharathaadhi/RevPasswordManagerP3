<div class="recover-wrapper">

  <!-- LEFT HERO SECTION -->
  <div class="recover-left">

    <h1 class="hero-title">
      Secure Identity <span>Recovery</span>
    </h1>

    <p class="hero-sub">
      Regain access safely with zero-knowledge encryption
      and intelligent security layers.
    </p>

    <div class="feature-pills">
      <div class="pill">🔐 Zero Knowledge</div>
      <div class="pill">⚡ Instant Verify</div>
      <div class="pill">🛡 Multi Layer Security</div>
      <div class="pill">🤖 AI Protection</div>
    </div>

  </div>

  <!-- RIGHT FORM -->
  <div class="recover-card">

    <h2>Recover Account</h2>

    <!-- SUCCESS MESSAGE -->
    <div *ngIf="successMessage && step !== 4" class="success-msg">
      {{ successMessage }}
    </div>

    <!-- ERROR MESSAGE -->
    <div *ngIf="errorMessage" class="error-msg">
      {{ errorMessage }}
    </div>

    <!-- ================= STEP 1 ================= -->
    <div *ngIf="step === 1">

      <input class="cyber-input"
             [(ngModel)]="usernameOrEmail"
             placeholder="Username or Email">

      <button class="cyber-btn" (click)="verifyUser()">
        Continue →
      </button>

    </div>

    <!-- ================= STEP 2 ================= -->
    <div *ngIf="step === 2">

      <div *ngFor="let q of questions; let i = index">

        <p class="question">
          {{ q }}
        </p>

        <input class="cyber-input"
               [(ngModel)]="answers[i]"
               name="answer{{i}}"
               placeholder="Your Answer">

      </div>

      <button class="cyber-btn" (click)="verifyAnswer()">
        Verify →
      </button>

    </div>

    <!-- ================= STEP 3 ================= -->
    <div *ngIf="step === 3">

      <div class="password-wrapper">

        <input class="cyber-input"
               [(ngModel)]="newPassword"
               [type]="showPassword ? 'text' : 'password'"
               placeholder="New Master Password">

        <span class="eye-icon" (click)="togglePassword()">
          👁
        </span>

      </div>

      <div class="password-wrapper">

        <input class="cyber-input"
               [(ngModel)]="confirmPassword"
               [type]="showConfirmPassword ? 'text' : 'password'"
               placeholder="Confirm Password">

        <span class="eye-icon" (click)="toggleConfirmPassword()">
          👁
        </span>

      </div>

      <button class="cyber-btn" (click)="resetPassword()">
        Reset Password →
      </button>

    </div>

    <!-- ================= STEP 4 SUCCESS ================= -->
    <div *ngIf="step === 4">

      <div class="success-msg">
        {{ successMessage }}
      </div>

      <button class="cyber-btn"
              (click)="goToLogin()">
        Go to Login →
      </button>

    </div>

  </div>

</div>
