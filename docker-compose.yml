version: '3.8'

services:
  eureka-server:
    build: ./eureka-server
    ports:
      - "8761:8761"

  config-server:
    build: ./config-server
    ports:
      - "8888:8888"
    depends_on:
      - eureka-server

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
      - config-server

  user-service:
    build: ./user-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://user-db:3306/userdb
    depends_on:
      - user-db
      - eureka-server

  vault-service:
    build: ./vault-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://vault-db:3306/vaultdb
    depends_on:
      - vault-db
      - eureka-server

  generator-service:
    build: ./generator-service
    ports:
      - "8083:8083"
    depends_on:
      - eureka-server

  security-service:
    build: ./security-service
    ports:
      - "8084:8084"
    depends_on:
      - eureka-server

  notification-service:
    build: ./notification-service
    ports:
      - "8085:8085"
    depends_on:
      - eureka-server

  user-db:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=userdb
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3307:3306"

  vault-db:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=vaultdb
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3308:3306"

networks:
  default:
    name: p3-network
