server.port=8084
spring.application.name=security-service
spring.config.import=optional:configserver:http://localhost:8888

# Priority Settings: Allow local properties to override remote Git config
spring.cloud.config.allow-override=true
spring.cloud.config.override-none=true

# Local Fallbacks (Docker will override these via environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/security_service_db}
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:Aadhi@2002}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true